<style>
:root{
  --bg:#131218;
  --bg2:#1a1922;
  --bg3:#22212c;
  --line:#2e2c3a;
  --txt:#e9e7f0;
  --dim:#9b97ad;
  --dim2:#6f6b80;
  --acc:#8b6cf0;
  --acc-soft:#8b6cf026;
  --ok:#4ec98a;
  --warn:#e8a33d;
  --radius:10px;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--txt);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{
  font:11px var(--mono);background:var(--bg3);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;
}

/* ---------- header ---------- */
.top{
  display:flex;align-items:center;gap:24px;
  padding:14px 20px;border-bottom:1px solid var(--line);
  background:var(--bg2);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;min-width:230px}
.mark{
  width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(140deg,var(--acc),#4ab8d8);
}
.top h1{font-size:16px;letter-spacing:.2px}
.sub{margin:0;font-size:11.5px;color:var(--dim2)}

.search-wrap{flex:1;position:relative;max-width:640px}
#search{
  width:100%;padding:9px 78px 9px 14px;
  background:var(--bg3);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--txt);font-size:14px;outline:none;
}
#search:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
#search::placeholder{color:var(--dim2)}
.search-count{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font:11px var(--mono);color:var(--dim2);pointer-events:none;
}

.progress-global{display:flex;align-items:center;gap:10px;min-width:170px}
.pg-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pg-bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
#pg-label{font:11px var(--mono);color:var(--dim);white-space:nowrap}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
.side{
  width:230px;flex:none;padding:18px 16px;overflow-y:auto;
  border-right:1px solid var(--line);background:var(--bg2);
}
.results{flex:1;overflow-y:auto;padding:20px 24px 80px}

.views{display:flex;gap:4px;background:var(--bg3);padding:3px;border-radius:8px;margin-bottom:20px}
.views button{flex:1;padding:6px 0;font-size:12.5px;color:var(--dim);border-radius:6px}
.views button.on{background:var(--acc);color:#fff;font-weight:500}

.filter-block{margin-bottom:22px}
.filter-block h2{
  font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--dim2);margin-bottom:9px;
}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{
  padding:4px 10px;font-size:12px;border-radius:20px;
  border:1px solid var(--line);color:var(--dim);
}
.chips button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--txt)}

.theme-list button{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:6px 8px;border-radius:7px;font-size:13px;color:var(--dim);text-align:left;
}
.theme-list button:hover{background:var(--bg3)}
.theme-list button.on{background:var(--acc-soft);color:var(--txt)}
.theme-list .tcount{margin-left:auto;font:10.5px var(--mono);color:var(--dim2)}
.theme-list .tdot{width:7px;height:7px;border-radius:50%;flex:none}

.reset{
  width:100%;padding:7px;font-size:12.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:7px;
}
.reset:hover{border-color:var(--acc);color:var(--txt)}
.hint{font-size:11px;color:var(--dim2);line-height:1.7;margin:12px 0 0}
.io{display:flex;gap:6px}
.io button{
  flex:1;padding:6px;font-size:12px;color:var(--dim);
  border:1px solid var(--line);border-radius:7px;
}
.io button:hover{border-color:var(--acc);color:var(--txt)}

/* ---------- groupes ---------- */
.group{margin-bottom:26px}
.group-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}
.group-head h3{font-size:13px;letter-spacing:.3px}
.group-head .gdot{width:9px;height:9px;border-radius:50%;flex:none}
.group-bar{width:110px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.group-bar i{display:block;height:100%;background:var(--ok)}
.group-meta{font:11px var(--mono);color:var(--dim2)}
.group.closed .cards{display:none}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:9px}

.card{
  position:relative;display:flex;gap:11px;align-items:flex-start;
  padding:11px 12px;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--radius);cursor:pointer;transition:border-color .15s,transform .1s;
}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card.done{opacity:.5}
.card.done .c-title{text-decoration:line-through;text-decoration-color:var(--dim2)}

.c-check{
  width:19px;height:19px;flex:none;margin-top:1px;border-radius:5px;
  border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:11px;color:transparent;
}
.card.done .c-check{background:var(--ok);border-color:var(--ok);color:#0f2418}
.c-body{min-width:0;flex:1}
.c-title{font-size:13.5px;line-height:1.35;margin-bottom:3px}
.c-en{font-size:11px;color:var(--dim2);margin-bottom:5px}
.c-meta{display:flex;align-items:center;gap:7px;font:10.5px var(--mono);color:var(--dim2)}
.c-num{color:var(--acc)}
.lvl{padding:1px 6px;border-radius:20px;border:1px solid var(--line)}
.lvl.avance{color:var(--warn);border-color:#e8a33d40}
.lvl.inter{color:#6fb6e8;border-color:#6fb6e840}
.c-flag{position:absolute;top:9px;right:10px;font-size:11px;color:var(--warn)}
.no-card{position:absolute;bottom:9px;right:10px;width:5px;height:5px;border-radius:50%;background:var(--dim2)}

.empty{padding:50px 10px;text-align:center;color:var(--dim2);font-size:13.5px}

/* ---------- fiche ---------- */
.sheet-backdrop{position:fixed;inset:0;background:#0009;z-index:30;backdrop-filter:blur(2px)}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);z-index:31;
  background:var(--bg2);border-left:1px solid var(--line);
  overflow-y:auto;padding:22px 26px 60px;
  animation:slide .18s ease-out;
}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

.sh-close{position:absolute;top:16px;right:20px;font-size:20px;color:var(--dim2);line-height:1}
.sh-close:hover{color:var(--txt)}
.sh-num{font:11px var(--mono);color:var(--acc);letter-spacing:1px}
.sh-title{font-size:22px;line-height:1.25;margin:6px 0 4px}
.sh-en{font-size:12.5px;color:var(--dim2);margin-bottom:14px}
.sh-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;font:11px var(--mono)}
.sh-meta span{padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}

.sh-actions{display:flex;gap:8px;margin-bottom:20px}
.sh-actions button,.sh-actions a{
  padding:8px 14px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;color:var(--dim);text-decoration:none;
}
.sh-actions button:hover,.sh-actions a:hover{border-color:var(--acc);color:var(--txt)}
.sh-actions .primary{background:var(--acc);border-color:var(--acc);color:#fff}
.sh-actions .primary.done{background:var(--ok);border-color:var(--ok);color:#0f2418}

.sh-sec{margin-bottom:20px}
.sh-sec h4{
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  color:var(--dim2);margin:0 0 8px;
}
.sh-sec p{margin:0;font-size:14.5px;line-height:1.6}
.sh-sec ol{margin:0;padding-left:20px;font-size:14px;line-height:1.75}
.sh-sec ol li::marker{color:var(--acc);font:11px var(--mono)}

.kbds{display:flex;flex-wrap:wrap;gap:8px}
.kbds div{
  display:flex;align-items:center;gap:7px;padding:5px 10px;
  background:var(--bg3);border-radius:7px;font-size:12.5px;color:var(--dim);
}
.kbds b{font:11.5px var(--mono);color:var(--txt);font-weight:600}

.piege{
  padding:11px 13px;background:#e8a33d14;border-left:2px solid var(--warn);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.55;
}
.ui-terms{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ui-terms span{color:var(--dim2)}
.ui-terms b{font-weight:500}

.note-area{
  width:100%;min-height:78px;padding:10px 12px;resize:vertical;
  background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  color:var(--txt);font:inherit;font-size:13.5px;outline:none;
}
.note-area:focus{border-color:var(--acc)}
.note-state{font:10.5px var(--mono);color:var(--dim2);margin-top:5px;height:13px}

.embed{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:20px}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed-ph{
  position:absolute;inset:0;display:grid;place-items:center;gap:8px;
  align-content:center;color:var(--dim);font-size:13px;cursor:pointer;
  background:var(--bg3);
}
.embed-ph b{
  display:grid;place-items:center;width:48px;height:48px;border-radius:50%;
  background:var(--acc);color:#fff;font-size:16px;
}

.trans{font-size:13px;line-height:1.75;color:var(--dim);max-height:280px;overflow-y:auto;
  padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
details summary{
  cursor:pointer;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  color:var(--dim2);margin-bottom:8px;
}
details summary:hover{color:var(--txt)}
mark{background:var(--acc-soft);color:var(--txt);border-radius:3px;padding:0 2px}

.related{display:flex;flex-wrap:wrap;gap:6px}
.related button{
  padding:5px 11px;font-size:12.5px;border:1px solid var(--line);
  border-radius:20px;color:var(--dim);
}
.related button:hover{border-color:var(--acc);color:var(--txt)}

@media(max-width:820px){
  .top{flex-wrap:wrap;gap:12px}
  .brand{min-width:0}
  .progress-global{order:3;width:100%}
  main{flex-direction:column}
  .side{width:100%;border-right:0;border-bottom:1px solid var(--line)}
  .results{padding:16px}
  .sheet{width:100%}
}

</style>
</head>

  </div>

  <div class="progress-global">
    <div class="pg-bar"><i id="pg-fill"></i></div>
    <span id="pg-label">0 / 100</span>

</header>

<main>
  <aside class="side">
    <nav class="views" id="views">
      <button data-view="themes" class="on">Thèmes</button>
      <button data-view="list">Liste</button>

    <div class="filter-block">

    <div class="filter-block">
      <h2>Thèmes</h2>
      <div id="theme-list" class="theme-list"></div>
    </div>

    <div class="filter-block">
      <button id="reset" class="reset">Tout réafficher</button>
      <p class="hint">Clic sur une leçon pour la fiche. <kbd>/</kbd> pour chercher, <kbd>Esc</kbd> pour fermer.</p>
    </div>

    <div class="filter-block">
      <h2>Ma progression</h2>
      <div class="io">
        <button id="export">Exporter</button>
        <button id="import">Importer</button>
      </div>
      <input type="file" id="import-file" accept="application/json" hidden>
      <p class="hint" id="io-hint">Progression et notes stockées sur cet appareil. Exporte pour les passer sur un autre.</p>

  </aside>

  <section class="results" id="results"></section>
</main>

<div class="sheet-backdrop" id="backdrop" hidden></div>

   "piege": "L'échantillon se reprend à chaque nouveau clic. Un fond dégradé demande donc de rééchantillonner souvent, sinon la gomme cesse d'agir et on croit qu'elle a lâché.",
   "ui": [
    {
     "fr": "Gomme d'arrière-plan",
     "en": "Background Erase Brush"
    }
   ],
   "related": [
    99,
    97,
    92
   ],
   "has_transcript": true
  },
  {
   "n": 99,
   "id": "B3ow035qW7Q",
   "title_en": "Flood Erase Tool",
   "title_fr": "Gomme par plage de couleur",
   "duration": 128,
   "theme": "pixel-photo",
   "level": "inter",
   "tags": [
    "gomme",
    "flood",
    "tolérance"
   ],
   "resume": "Effacer d'un clic toute une plage de couleur, typiquement un fond vert ou un aplat uni.",
   "steps": [
    "Clic droit sur le calque > Pixelliser (obligatoire)",
    "Mode pixel, groupe Gomme, prendre la Gomme par plage de couleur",
    "Cliquer sur la couleur à faire disparaître",
    "La zone devient transparente, le calque du dessous apparaît",
    "Reprendre les restes à la gomme d'arrière-plan ou à la gomme classique"
   ],
   "shortcuts": [
    {
     "k": "⌘Z",
     "d": "annuler si la plage mord sur le sujet"
    }
   ],
   "piege": "Sur un calque non pixellisé, le clic ne fait strictement rien, sans message. C'est exactement le moment où on croit que l'outil est cassé : pixelliser d'abord.",
   "ui": [
    {
     "fr": "Gomme par plage",
     "en": "Flood Erase Tool"
    }
   ],
   "related": [
    29,
    98,
    92
   ],
   "has_transcript": true
  },
  {
   "n": 100,
   "id": "QEIZlfE7sEY",
   "title_en": "Adjustment Brush Tool",
   "title_fr": "Pinceau de réglage",
   "duration": 193,
   "theme": "pixel-photo",
   "level": "avance",
   "tags": [
    "réglage",
    "pinceau",
    "retouche locale"
   ],
   "resume": "Éclaircir ou assombrir une zone en la peignant, de façon non destructive : chaque coup de pinceau crée un calque de réglage réajustable.",
   "steps": [
    "Mode pixel, développer le groupe Pinceau, prendre le Pinceau de réglage",
    "Peindre la zone à traiter : un calque de réglage d'exposition apparaît",
    "Régler le curseur d'exposition après coup, en positif ou en négatif",
    "Régler l'opacité et le mode de fusion du réglage",
    "Peindre une autre zone pour une deuxième retouche indépendante",
    "Supprimer le calque pour annuler proprement la retouche"
   ],
   "shortcuts": [
    {
     "k": "[ et ]",
     "d": "taille du pinceau"
    }
   ],
   "piege": "Chaque zone peinte crée SON calque : au bout de dix retouches la pile est illisible. Renommer au fur et à mesure, ou regrouper, sinon on ne sait plus quel curseur agit sur quoi.",
   "ui": [
    {
     "fr": "Pinceau de réglage",
     "en": "Adjustment Brush Tool"
    },
    {
     "fr": "Exposition",
     "en": "Exposure"
    }
   ],
   "related": [
    79,
    32,
    97
   ],
   "has_transcript": true
  }
 ]
};
</script>
<script>
/* AffinityDB - interface de consultation des 100 lecons Affinity */

const THEMES = {
  interface:            { label: "Interface & calques",   color: "#8b6cf0" },
  vecteur:              { label: "Vecteur & tracés",      color: "#4ab8d8" },
  "formes-booleens":    { label: "Formes & booléens",     color: "#4ec98a" },
  typo:                 { label: "Typographie",           color: "#e8a33d" },
  pinceaux:             { label: "Pinceaux",              color: "#e87d9c" },
  "couleur-effets":     { label: "Couleur & effets",      color: "#d868d8" },
  "pixel-photo":        { label: "Pixel & photo",         color: "#6fb6e8" },
  "grilles-alignement": { label: "Grilles & alignement",  color: "#9ab84a" },
  export:               { label: "Export",                color: "#c98a5e" },
};
const LEVELS = { base: "base", inter: "inter", avance: "avancé" };
const THEME_ORDER = Object.keys(THEMES);

const state = {
  lessons: [],
  progress: {},          // { "71": { done: true, note: "..." } }
  view: "themes",
  query: "",
  levels: new Set(),
  themes: new Set(),
  closed: new Set(),
  transcripts: {},       // n -> texte (le paquet complet, chargé à la 1re recherche)
  indexed: false,
  hasApi: false,         // vrai en local avec server.py, faux en prod statique
  open: null,
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* tout le HTML injecté est construit ici et passe par esc() : pas de contenu distant */
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const paint = (el, markup) => el.replaceChildren(document.createRange().createContextualFragment(markup));

const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const norm = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

/* ---------- chargement ---------- */

const LOCAL_KEY = "affinitydb";

// server.py n'existe qu'en local ; en prod (statique O2Switch) tout vit dans
// localStorage, exactement comme /assiette. On ne sonde l'API qu'en local,
// sinon la console se remplit d'un 404 a chaque chargement.
const LOCAL_HOST = ["localhost", "127.0.0.1"].includes(location.hostname);

async function boot() {
  const [db, prog] = await Promise.all([
    // en prod la base est deja dans la page (build_prod.py) : O2Switch renvoie
    // des 429 des que la page demande 4 ou 5 fichiers d'un coup
    window.__LESSONS__ ? Promise.resolve(window.__LESSONS__) : fetch("lessons.js").then((r) => r.json()),
    LOCAL_HOST
      ? fetch("api/progress").then((r) => (r.ok ? r.json() : null)).catch(() => null)
      : Promise.resolve(null),
  ]);
  state.lessons = db.lessons;
  state.hasApi = prog !== null;
  state.progress = prog || JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}");
  buildSidebar();
  render();
  wire();
}

let saveTimer;
function save() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(state.progress));
  if (!state.hasApi) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch("api/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state.progress),
    }).catch(() => {});
  }, 400);
}

const prog = (n) => state.progress[n] || {};
const isDone = (n) => !!prog(n).done;

/* les 100 transcripts tiennent dans un seul fichier : une requete au lieu de
   cent (O2Switch coupe au-dela, et ca evite de charger 500 Ko en 4G tant que
   personne ne cherche) */
let bundlePromise = null;
function loadTranscripts() {
  if (!bundlePromise) {
    bundlePromise = fetch("transcripts.js")
      .then((r) => (r.ok ? r.json() : {}))
      .catch(() => ({}))
      .then((b) => { state.transcripts = b; state.indexed = true; return b; });
  }
  return bundlePromise;
}

async function indexAll() {
  if (state.indexed) return;
  await loadTranscripts();
  if (state.query) render();
}

/* ---------- filtrage ---------- */

function haystack(l) {
  return norm([
    l.n, l.title_fr, l.title_en, l.tags.join(" "), l.resume,
    (l.steps || []).join(" "), l.piege,
    (l.ui || []).map((u) => `${u.fr} ${u.en}`).join(" "),
    state.transcripts[l.n] || "",
  ].join(" "));
}

function filtered() {
  const q = norm(state.query.trim());
  return state.lessons.filter((l) => {
    if (state.levels.size && !state.levels.has(l.level)) return false;
    if (state.themes.size && !state.themes.has(l.theme)) return false;
    if (state.view === "todo" && isDone(l.n)) return false;
    if (q && !haystack(l).includes(q)) return false;
    return true;
  });
}

/* ---------- rendu ---------- */

function buildSidebar() {
  paint($("#theme-list"), THEME_ORDER.map((k) => {
    const n = state.lessons.filter((l) => l.theme === k).length;
    return `<button data-theme="${k}">
      <span class="tdot" style="background:${THEMES[k].color}"></span>
      <span>${THEMES[k].label}</span><span class="tcount">${n}</span></button>`;
  }).join(""));
}

function card(l) {
  const done = isDone(l.n);
  const note = prog(l.n).note;
  return `<div class="card${done ? " done" : ""}" data-n="${l.n}">
    <div class="c-check" data-check="${l.n}">✓</div>
    <div class="c-body">
      <div class="c-title">${esc(l.title_fr || l.title_en)}</div>
      <div class="c-en">${esc(l.title_en)}</div>
      <div class="c-meta">
        <span class="c-num">L${l.n}</span>
        <span>${mmss(l.duration)}</span>
        <span class="lvl ${l.level}">${LEVELS[l.level]}</span>
      </div>
    </div>
    ${note ? '<span class="c-flag" title="tu as une note">✎</span>' : ""}
    ${l.resume ? "" : '<span class="no-card" title="fiche pas encore rédigée"></span>'}
  </div>`;
}

function groupBlock(key, items) {
  const done = items.filter((l) => isDone(l.n)).length;
  const pct = items.length ? (done / items.length) * 100 : 0;
  const t = THEMES[key] || { label: key, color: "#8b6cf0" };
  return `<div class="group${state.closed.has(key) ? " closed" : ""}" data-group="${key}">
    <div class="group-head">
      <span class="gdot" style="background:${t.color}"></span>
      <h3>${t.label}</h3>
      <div class="group-bar"><i style="width:${pct}%"></i></div>
      <span class="group-meta">${done}/${items.length}</span>
    </div>
    <div class="cards">${items.map(card).join("")}</div>
  </div>`;
}

function render() {
  const list = filtered();
  const box = $("#results");

  $("#search-count").textContent = state.query ? `${list.length} résultat${list.length > 1 ? "s" : ""}` : "";

  const done = state.lessons.filter((l) => isDone(l.n)).length;
  $("#pg-fill").style.width = `${(done / state.lessons.length) * 100}%`;
  $("#pg-label").textContent = `${done} / ${state.lessons.length}`;

  if (!list.length) {
    paint(box, `<p class="empty">${state.view === "todo" && !state.query ? "Tout est vu. Bien joué." : "Rien ne correspond."}</p>`);
    return;
  }

  if (state.view === "themes" && !state.query) {
    paint(box, THEME_ORDER
      .map((k) => [k, list.filter((l) => l.theme === k)])
      .filter(([, items]) => items.length)
      .map(([k, items]) => groupBlock(k, items))
      .join(""));
  } else {
    paint(box, `<div class="cards">${list.map(card).join("")}</div>`);
  }
}

/* ---------- fiche ---------- */

function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
  return safe.replace(re, "<mark>$1</mark>");
}

async function openSheet(n) {
  const l = state.lessons.find((x) => x.n === n);
  if (!l) return;
  state.open = n;
  const p = prog(n);
  const t = THEMES[l.theme];
  const txt = l.has_transcript ? (await loadTranscripts())[n] || "" : "";

  const sec = (title, markup) => (markup ? `<div class="sh-sec"><h4>${title}</h4>${markup}</div>` : "");

  paint($("#sheet"), `
    <button class="sh-close" data-close>×</button>
    <div class="sh-num">LEÇON ${n}</div>
    <h2 class="sh-title">${esc(l.title_fr || l.title_en)}</h2>
    <div class="sh-en">${esc(l.title_en)}</div>
    <div class="sh-meta">
      <span style="color:${t.color}">${t.label}</span>
      <span>${LEVELS[l.level]}</span>
      <span>${mmss(l.duration)}</span>
      ${l.tags.map((x) => `<span>${esc(x)}</span>`).join("")}
    </div>

    <div class="sh-actions">
      <button class="primary${p.done ? " done" : ""}" data-toggle="${n}">${p.done ? "✓ vue" : "marquer comme vue"}</button>
      <a href="https://www.youtube.com/watch?v=${esc(l.id)}&list=PL_dhPga7ruucfyaDJq9hYQGPTNKkDcNBO" target="_blank" rel="noreferrer">ouvrir sur YouTube</a>
    </div>

    <div class="embed" data-embed="${esc(l.id)}">
      <div class="embed-ph"><b>▶</b><span>charger la vidéo</span></div>
    </div>

    ${l.resume ? "" : '<div class="sh-sec"><div class="piege">Fiche pas encore rédigée pour cette leçon. Le transcript brut est en bas.</div></div>'}
    ${sec("À quoi ça sert", l.resume ? `<p>${esc(l.resume)}</p>` : "")}
    ${sec("La manip", l.steps?.length ? `<ol>${l.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>` : "")}
    ${sec("Raccourcis", l.shortcuts?.length ? `<div class="kbds">${l.shortcuts.map((s) => `<div><b>${esc(s.k)}</b><span>${esc(s.d)}</span></div>`).join("")}</div>` : "")}
    ${sec("Piège", l.piege ? `<div class="piege">${esc(l.piege)}</div>` : "")}
    ${sec("Vocabulaire FR / EN", l.ui?.length ? `<div class="ui-terms">${l.ui.map((u) => `<div><b>${esc(u.fr)}</b> <span>= ${esc(u.en)}</span></div>`).join("")}</div>` : "")}
    ${sec("À enchaîner avec", l.related?.length ? `<div class="related">${l.related.map((r) => { const o = state.lessons.find((x) => x.n === r); return o ? `<button data-goto="${r}">L${r} · ${esc(o.title_fr || o.title_en)}</button>` : ""; }).join("")}</div>` : "")}

    ${sec("Ma note", `<textarea class="note-area" data-note="${n}" placeholder="ce que tu retiens, ton usage a toi...">${esc(p.note || "")}</textarea><div class="note-state" data-notestate></div>`)}

    ${txt ? `<details${state.query ? " open" : ""}><summary>Transcript brut (EN, sous-titres auto)</summary><div class="trans">${highlight(txt, state.query.trim())}</div></details>` : ""}
  `);
  $("#sheet").hidden = false;
  $("#backdrop").hidden = false;
  $("#sheet").scrollTop = 0;
}

function closeSheet() {
  state.open = null;
  $("#sheet").hidden = true;
  $("#backdrop").hidden = true;
}

function toggleDone(n) {
  const p = state.progress[n] || (state.progress[n] = {});
  p.done = !p.done;
  if (p.done) p.at = new Date().toISOString().slice(0, 10);
  else delete p.at;
  save();
  render();
  if (state.open === n) openSheet(n);
}

/* ---------- evenements ---------- */

function wire() {
  $("#search").addEventListener("input", (e) => {
    state.query = e.target.value;
    indexAll();
    render();
  });

  $("#views").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-view]");
    if (!b) return;
    state.view = b.dataset.view;
    $$("#views button").forEach((x) => x.classList.toggle("on", x === b));
    render();
  });

  $("#levels").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-level]");
    if (!b) return;
    if (state.levels.has(b.dataset.level)) state.levels.delete(b.dataset.level);
    else state.levels.add(b.dataset.level);
    b.classList.toggle("on");
    render();
  });

  $("#theme-list").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-theme]");
    if (!b) return;
    if (state.themes.has(b.dataset.theme)) state.themes.delete(b.dataset.theme);
    else state.themes.add(b.dataset.theme);
    b.classList.toggle("on");
    render();
  });

  $("#reset").addEventListener("click", () => {
    state.query = "";
    state.levels.clear();
    state.themes.clear();
    state.view = "themes";
    $("#search").value = "";
    $$(".chips button, .theme-list button").forEach((b) => b.classList.remove("on"));
    $$("#views button").forEach((x) => x.classList.toggle("on", x.dataset.view === "themes"));
    render();
  });

  $("#export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state.progress, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "affinitydb-progression.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("#import").addEventListener("click", () => $("#import-file").click());

  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const incoming = JSON.parse(await file.text());
      // fusion : on ne perd pas ce qui est deja coche sur cet appareil
      for (const [k, v] of Object.entries(incoming)) {
        state.progress[k] = { ...(state.progress[k] || {}), ...v };
      }
      save();
      render();
      $("#io-hint").textContent = `${Object.keys(incoming).length} leçons fusionnées.`;
    } catch {
      $("#io-hint").textContent = "Fichier illisible.";
    }
    e.target.value = "";
  });

  $("#results").addEventListener("click", (e) => {
    const check = e.target.closest("[data-check]");
    if (check) { e.stopPropagation(); return toggleDone(+check.dataset.check); }
    const head = e.target.closest(".group-head");
    if (head) {
      const k = head.parentElement.dataset.group;
      if (state.closed.has(k)) state.closed.delete(k);
      else state.closed.add(k);
      return render();
    }
    const c = e.target.closest(".card");
    if (c) openSheet(+c.dataset.n);
  });

  $("#backdrop").addEventListener("click", closeSheet);

  $("#sheet").addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) return closeSheet();
    const tg = e.target.closest("[data-toggle]");
    if (tg) return toggleDone(+tg.dataset.toggle);
    const go = e.target.closest("[data-goto]");
    if (go) return openSheet(+go.dataset.goto);
    const emb = e.target.closest("[data-embed]");
    if (emb && emb.querySelector(".embed-ph")) {
      paint(emb, `<iframe src="https://www.youtube-nocookie.com/embed/${esc(emb.dataset.embed)}?autoplay=1&rel=0"
        allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`);
    }
  });

  $("#sheet").addEventListener("input", (e) => {
    const ta = e.target.closest("[data-note]");
    if (!ta) return;
    const n = +ta.dataset.note;
    const p = state.progress[n] || (state.progress[n] = {});
    p.note = ta.value;
    if (!p.note) delete p.note;
    save();
    const st = $("[data-notestate]", $("#sheet"));
    if (st) { st.textContent = "enregistré"; setTimeout(() => (st.textContent = ""), 1200); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") return closeSheet();
    const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
    if (e.key === "/" && !typing) {
      e.preventDefault();
      $("#search").focus();
    }
  });
}

boot();

</script>
</body>
</html>
